  <!-- Service Worker para PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swCode = `
          self.addEventListener('install', (e) => { self.skipWaiting(); });
          self.addEventListener('activate', (e) => { e.waitUntil(clients.claim()); });
          self.addEventListener('fetch', (e) => { e.respondWith(fetch(e.request).catch(() => caches.match(e.request))); });
        `;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(blob);
        navigator.serviceWorker.register(swUrl).catch(() => {});
      });
    }
  </script>

    function saveState() {

      localStorage.setItem("ruleMaster_dev_password", state.devPassword);

    // VOZ (TEXT TO SPEECH)
    function speakText(text) {
      if (!state.isVoiceEnabled || !('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        const cleanText = text.replace(/[*#_~`]/g, '');
        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = 'pt-BR';
        utterance.rate = 1.05;
        window.speechSynthesis.speak(utterance);
      } catch (e) {}
    }

    // VOZ (SPEECH RECOGNITION)
    function startListening() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Ditado por voz não suportado neste navegador.");
        return;
      }
      try {
        const recognition = new SpeechRecognition();
        recognition.lang = 'pt-BR';
        recognition.onstart = () => { state.isListening = true; render(); };
        recognition.onresult = (e) => {
          const text = e.results[0][0].transcript;
          const inputEl = document.getElementById("chat-input-field");
          if (inputEl) inputEl.value = text;
          state.isListening = false;
          render();
        };
        recognition.onerror = () => { state.isListening = false; render(); };
        recognition.onend = () => { state.isListening = false; render(); };
        recognition.start();
      } catch (err) {
        state.isListening = false;
        render();
      }
    }

    // JUIZ VIRTUAL - ENVIAR MENSAGEM
    function handleSendMessage(e) {
      if (e) e.preventDefault();
      const inputEl = document.getElementById("chat-input-field");
      if (!inputEl || !inputEl.value.trim() || state.isAiThinking) return;

      const userText = inputEl.value.trim();
      inputEl.value = "";

      state.chatMessages.push({ role: "user", text: userText });
      state.isAiThinking = true;
      render();

      setTimeout(() => {
        const game = state.games[state.selectedGameKey] || Object.values(state.games)[0];
        const q = userText.toLowerCase();
        let reply = "";

        if (q.includes("vencer") || q.includes("vitoria") || q.includes("pontos")) {
          reply = `Para vencer em **${game.name}**: ${game.victoryCondition}`;
        } else if (q.includes("setup") || q.includes("prepara") || q.includes("iniciar")) {
          reply = `Preparação de **${game.name}**: ${game.setup ? game.setup.join(" ") : "Siga o padrão do manual."}`;
        } else if (q.includes("turno") || q.includes("jogada") || q.includes("acao")) {
          reply = `No seu turno em **${game.name}**: ${game.turnStructure ? game.turnStructure.join(" | ") : "Execute as ações do turno."}`;
        } else {
          reply = `Consulta (${game.name}): Conforme o manual oficial, ${game.objective} Confira o resumo rápido na aba Visão Geral!`;
        }

        state.chatMessages.push({ role: "assistant", text: reply });
        state.isAiThinking = false;
        render();
        speakText(reply);
      }, 500);
    }

    // CADASTRO MANUAL DE NOVO JOGO
    function handleCreateGameForm(e) {
      e.preventDefault();
      const name = document.getElementById("new-game-name").value.trim();
      if (!name) return;

      const newKey = `game_${Date.now()}`;
      const newGame = {
        id: newKey,
        name: name,
        category: document.getElementById("new-game-category").value || "Tabuleiro",
        icon: document.getElementById("new-game-icon").value || "🎲",
        players: "2-4 Jogadores",
        duration: "30 min",
        difficulty: "Médio",
        color: "from-purple-600 to-indigo-700",
        isPublished: true,
        objective: document.getElementById("new-game-objective").value || "Objetivo do jogo.",
        victoryCondition: document.getElementById("new-game-victory").value || "Como vencer.",
        setup: ["Preparação padrão do jogo."],
        turnStructure: ["Fazer ações no seu turno."],
        quickCheatSheet: ["Resumo da partida."],
        houseRules: [],
        faqs: [],
        youtubeVideos: []
      };

      state.games[newKey] = newGame;
      state.selectedGameKey = newKey;
      state.editingGameKey = newKey;
      saveState();

      alert(`🎉 Jogo "${newGame.name}" cadastrado e adicionado à estante!`);
      render();
    }

    // RENDERIZADOR PRINCIPAL (VANILLA DOM)
    function render() {
      const root = document.getElementById("app-root");
      const cfg = state.config;
      const gamesList = Object.values(state.games).filter(g => {
        if (!state.playerSearchQuery) return true;
        return g.name.toLowerCase().includes(state.playerSearchQuery.toLowerCase());
      });
      const selectedGame = state.games[state.selectedGameKey] || gamesList[0] || BUILTIN_GAMES.wonders_7;
      const editingGame = state.games[state.editingGameKey] || selectedGame;

      const cardStyle = `background-color: ${cfg.customCardBgColor}; border-color: ${cfg.customBorderColor}; color: ${cfg.customTextColor};`;
      const accentStyle = `background-color: ${cfg.customAccentColor}; color: #ffffff;`;

      let html = `
        <!-- HEADER -->
        <header class="border-b sticky top-0 z-40 backdrop-blur-md" style="background-color: ${cfg.customBgColor}ee; border-color: ${cfg.customBorderColor}">
          <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-4">
            <div class="flex items-center gap-3">
              <span class="text-2xl p-2 rounded-2xl border" style="${cardStyle}">${cfg.logoIcon}</span>
              <div>
                <h1 class="text-base font-black tracking-wide text-white flex items-center gap-2">
                  ${cfg.appTitle}
                  <span class="text-[10px] uppercase font-bold px-2 py-0.5 rounded-full bg-purple-500/20 text-purple-300 border border-purple-500/30 flex items-center gap-1">
                    ${getIcon("cloud", "w-3 h-3 text-emerald-400")}
                    ${gamesList.length} Jogos
                  </span>
                </h1>
                <p class="text-xs text-slate-400 hidden sm:block">${cfg.appSubtitle}</p>
              </div>
            </div>

            <div class="flex items-center gap-2 p-1 rounded-2xl border" style="${cardStyle}">
              <button onclick="state.appMode='player'; render();" class="px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 ${state.appMode === 'player' ? 'text-white shadow-lg' : 'text-slate-400'}" style="${state.appMode === 'player' ? accentStyle : ''}">
                ${getIcon("users", "w-3.5 h-3.5")} <span>Jogadores</span>
              </button>
              <button onclick="if(state.isDevAuthenticated){ state.appMode='dev'; render(); } else { state.showPasswordModal=true; render(); }" class="px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 ${state.appMode === 'dev' ? 'bg-amber-600 text-white shadow-lg' : 'text-slate-400'}">
                ${getIcon("shield", "w-3.5 h-3.5")} <span>Painel Dev</span>
                ${!state.isDevAuthenticated ? getIcon("lock", "w-3 h-3 text-amber-400") : ''}
              </button>
            </div>
          </div>
        </header>

        <!-- MODAL SENHA DEV -->
        ${state.showPasswordModal ? `
          <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 animate-fadeIn">
            <div class="p-6 rounded-3xl max-w-md w-full border shadow-2xl space-y-4" style="${cardStyle}">
              <div class="flex items-center justify-between border-b pb-3" style="border-color: ${cfg.customBorderColor}">
                <div class="flex items-center gap-2.5">
                  ${getIcon("key", "w-5 h-5 text-amber-400")}
                  <h3 class="text-base font-bold text-white">Acesso do Desenvolvedor</h3>
                </div>
                <button onclick="state.showPasswordModal=false; render();" class="text-slate-400 hover:text-white">${getIcon("x", "w-5 h-5")}</button>
              </div>
              <form onsubmit="
                event.preventDefault();
                const pass = document.getElementById('pass-input').value;
                if(pass === state.devPassword){
                  state.isDevAuthenticated = true;
                  state.showPasswordModal = false;
                  state.appMode = 'dev';
                  render();
                } else {
                  document.getElementById('pass-err').innerText = 'Senha incorreta (Padrão: 0000)';
                }
              " class="space-y-4">
                <div>
                  <label class="text-xs font-bold text-slate-300 block mb-1">Senha Dev</label>
                  <input id="pass-input" type="password" placeholder="Senha (Padrão: 0000)" autofocus class="w-full border rounded-xl px-4 py-3 text-sm text-white focus:outline-none" style="background-color: ${cfg.customBgColor}; border-color: ${cfg.customBorderColor}" />
                  <p id="pass-err" class="text-xs text-rose-400 mt-2"></p>
                </div>
                <button type="submit" class="w-full py-2.5 rounded-xl text-xs font-bold bg-amber-600 text-white shadow-lg">Entrar</button>
              </form>
            </div>
          </div>
        ` : ''}

        <!-- CONTEÚDO -->
        <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 space-y-6">
          ${state.appMode === 'player' ? `
            <!-- BARRA DE SELEÇÃO DE JOGOS -->
            <div class="p-4 rounded-3xl border space-y-3" style="${cardStyle}">
              <div class="relative">
                <input type="text" placeholder="🔍 Filtrar entre os jogos da estante..." value="${state.playerSearchQuery}" oninput="state.playerSearchQuery=this.value; render();" class="w-full border rounded-xl pl-9 pr-4 py-2.5 text-xs text-white focus:outline-none" style="background-color: ${cfg.customBgColor}; border-color: ${cfg.customBorderColor}" />
                <div class="absolute left-3 top-3 text-slate-500">${getIcon("search", "w-4 h-4")}</div>
              </div>

              <div class="flex items-center gap-2 overflow-x-auto pt-1 pb-1">
                ${gamesList.map(g => `
                  <button onclick="state.selectedGameKey='${g.id}'; state.chatMessages=[{role:'assistant', text:'Consultando regras de **${g.name}**.'}]; render();" class="px-3.5 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 border shrink-0 ${state.selectedGameKey === g.id ? 'text-white shadow-lg scale-105' : 'text-slate-400'}" style="${state.selectedGameKey === g.id ? accentStyle : `background-color: ${cfg.customBgColor}; border-color: ${cfg.customBorderColor}`}">
                    <span>${g.icon || '🎲'}</span>
                    <span>${g.name}</span>
                  </button>
                `).join('')}
              </div>
            </div>

            <!-- ABAS JOGADOR -->
            <div class="flex items-center gap-2 border-b pb-2 overflow-x-auto" style="border-color: ${cfg.customBorderColor}">
              <button onclick="state.playerTab='overview'; render();" class="px-4 py-2 text-xs font-bold flex items-center gap-2 border-b-2 ${state.playerTab === 'overview' ? 'border-amber-400 text-amber-400' : 'border-transparent text-slate-400'}">
                ${getIcon("book", "w-4 h-4")} Visão Geral
              </button>
              <button onclick="state.playerTab='setup'; render();" class="px-4 py-2 text-xs font-bold flex items-center gap-2 border-b-2 ${state.playerTab === 'setup' ? 'border-amber-400 text-amber-400' : 'border-transparent text-slate-400'}">
                ${getIcon("layers", "w-4 h-4")} Setup & Turno
              </button>
              <button onclick="state.playerTab='referee'; render();" class="px-4 py-2 text-xs font-bold flex items-center gap-2 border-b-2 ${state.playerTab === 'referee' ? 'border-amber-400 text-amber-400' : 'border-transparent text-slate-400'}">
                ${getIcon("message", "w-4 h-4")} Juiz IA (Voz)
              </button>
            </div>

            ${state.playerTab === 'overview' && selectedGame ? `
              <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 animate-fadeIn">
                <div class="lg:col-span-2 space-y-6">
                  <div class="p-6 rounded-3xl border space-y-4 shadow-2xl" style="${cardStyle}">
                    <div class="flex items-center gap-4">
                      <div class="w-16 h-16 rounded-2xl bg-gradient-to-br ${selectedGame.color || 'from-purple-600 to-indigo-700'} flex items-center justify-center text-3xl shadow-lg shrink-0">
                        ${selectedGame.icon}
                      </div>
                      <div>
                        <h2 class="text-xl font-black text-white">${selectedGame.name}</h2>
                        <p class="text-xs text-slate-400">${selectedGame.category} • ${selectedGame.players} • ${selectedGame.duration}</p>
                      </div>
                    </div>
                    <p class="text-xs text-slate-200 leading-relaxed pt-2">${selectedGame.objective}</p>
                  </div>

                  <div class="p-6 rounded-3xl border space-y-3" style="${cardStyle}">
                    <h3 class="text-xs font-bold text-amber-400 uppercase tracking-wider">Condição de Vitória</h3>
                    <p class="text-xs text-slate-200">${selectedGame.victoryCondition}</p>
                  </div>
                </div>

                <div class="p-6 rounded-3xl border space-y-3" style="${cardStyle}">
                  <h3 class="text-xs font-bold text-amber-400 uppercase tracking-wider flex items-center gap-2">
                    ${getIcon("zap", "w-4 h-4")} Resumo Rápido
                  </h3>
                  <ul class="space-y-2 text-xs text-slate-300">
                    ${(selectedGame.quickCheatSheet || []).map(item => `
                      <li class="flex items-start gap-2">${getIcon("check", "w-4 h-4 text-emerald-400 shrink-0")} <span>${item}</span></li>
                    `).join('')}
                  </ul>
                </div>
              </div>
            ` : ''}

            ${state.playerTab === 'setup' && selectedGame ? `
              <div class="grid grid-cols-1 md:grid-cols-2 gap-6 animate-fadeIn">
                <div class="p-6 rounded-3xl border space-y-4" style="${cardStyle}">
                  <h3 class="text-xs font-bold text-emerald-400 uppercase tracking-wider flex items-center gap-2">
                    ${getIcon("layers", "w-4 h-4")} Preparação
                  </h3>
                  <ol class="space-y-2 text-xs text-slate-300">
                    ${(selectedGame.setup || []).map((step, i) => `
                      <li class="p-2.5 rounded-xl border flex items-center gap-2" style="background-color: ${cfg.customBgColor}; border-color: ${cfg.customBorderColor}">
                        <span class="font-bold text-emerald-400">${i+1}.</span> ${step}
                      </li>
                    `).join('')}
                  </ol>
                </div>

                <div class="p-6 rounded-3xl border space-y-4" style="${cardStyle}">
                  <h3 class="text-xs font-bold text-amber-400 uppercase tracking-wider flex items-center gap-2">
                    ${getIcon("clock", "w-4 h-4")} Estrutura do Turno
                  </h3>
                  <div class="space-y-2 text-xs text-slate-300">
                    ${(selectedGame.turnStructure || []).map(step => `
                      <div class="p-2.5 rounded-xl border" style="background-color: ${cfg.customBgColor}; border-color: ${cfg.customBorderColor}">${step}</div>
                    `).join('')}
                  </div>
                </div>
              </div>
            ` : ''}

            ${state.playerTab === 'referee' ? `
              <div class="p-6 rounded-3xl border space-y-4 max-w-3xl mx-auto animate-fadeIn" style="${cardStyle}">
                <div class="flex items-center justify-between border-b pb-3" style="border-color: ${cfg.customBorderColor}">
                  <div class="flex items-center gap-3">
                    ${getIcon("bot", "w-6 h-6 text-amber-400")}
                    <div>
                      <h3 class="text-sm font-bold text-white">Juiz Virtual DA MESA</h3>
                      <p class="text-[11px] text-slate-400">${selectedGame.name}</p>
                    </div>
                  </div>
                  <button onclick="state.isVoiceEnabled=!state.isVoiceEnabled; render();" class="p-2 rounded-xl border text-xs">
                    ${getIcon("volume", `w-4 h-4 ${state.isVoiceEnabled ? 'text-amber-400' : 'text-slate-500'}`)}
                  </button>
                </div>

                <div class="h-80 overflow-y-auto space-y-3 p-4 rounded-2xl border" style="background-color: ${cfg.customBgColor}; border-color: ${cfg.customBorderColor}">
                  ${state.chatMessages.map(msg => `
                    <div class="flex gap-3 ${msg.role === 'user' ? 'justify-end' : 'justify-start'}">
                      <div class="p-3.5 rounded-2xl text-xs ${msg.role === 'user' ? 'text-white' : 'text-slate-200 border'}" style="${msg.role === 'user' ? accentStyle : cardStyle}">
                        ${msg.text}
                      </div>
                    </div>
                  `).join('')}
                  ${state.isAiThinking ? `<div class="text-xs text-slate-500 italic">Juiz consultando regras...</div>` : ''}
                </div>

                <form onsubmit="handleSendMessage(event);" class="flex gap-2">
                  <button type="button" onclick="startListening();" class="p-3 rounded-xl border text-white ${state.isListening ? 'bg-rose-600' : 'bg-slate-800'}">
                    ${getIcon("mic", "w-4 h-4 text-amber-400")}
                  </button>
                  <input id="chat-input-field" type="text" placeholder="Dúvida sobre as regras..." class="flex-1 border rounded-xl px-4 py-3 text-xs text-white" style="background-color: ${cfg.customBgColor}; border-color: ${cfg.customBorderColor}" />
                  <button type="submit" class="px-5 py-3 rounded-xl text-white font-bold text-xs shadow-lg" style="${accentStyle}">
                    ${getIcon("send", "w-3.5 h-3.5")}
                  </button>
                </form>
              </div>
            ` : ''}

          ` : `
            <!-- PAINEL DEV -->
            <div class="space-y-6">
              <div class="p-4 rounded-3xl border flex items-center justify-between" style="${cardStyle}">
                <div class="flex items-center gap-3">
                  ${getIcon("shield", "w-6 h-6 text-amber-400")}
                  <div>
                    <h2 class="text-base font-bold text-white">Painel do Desenvolvedor</h2>
                    <p class="text-xs text-slate-400">Cadastre futuros jogos e gerencie a biblioteca</p>
                  </div>
                </div>
                <button onclick="state.appMode='player'; render();" class="px-4 py-2 rounded-xl border text-xs font-bold hover:border-amber-500">
                  👁️ Ver Como Jogador
                </button>
              </div>

              <div class="p-6 rounded-3xl border space-y-4" style="${cardStyle}">
                <h3 class="text-base font-bold text-white flex items-center gap-2">
                  ${getIcon("plus", "w-5 h-5 text-amber-400")} Cadastrar Futuro Jogo na Estante
                </h3>

                <form onsubmit="handleCreateGameForm(event);" class="space-y-4 pt-2">
                  <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                      <label class="text-xs font-bold text-slate-300 block mb-1">Nome do Jogo *</label>
                      <input id="new-game-name" type="text" required placeholder="Ex: Catan" class="w-full border rounded-xl p-2.5 text-xs text-white" style="background-color: ${cfg.customBgColor}; border-color: ${cfg.customBorderColor}" />
                    </div>
                    <div>
                      <label class="text-xs font-bold text-slate-300 block mb-1">Categoria</label>
                      <input id="new-game-category" type="text" placeholder="Ex: Estratégia" class="w-full border rounded-xl p-2.5 text-xs text-white" style="background-color: ${cfg.customBgColor}; border-color: ${cfg.customBorderColor}" />
                    </div>
                    <div>
                      <label class="text-xs font-bold text-slate-300 block mb-1">Emoji / Ícone</label>
                      <input id="new-game-icon" type="text" value="🎲" class="w-full border rounded-xl p-2.5 text-xs text-white text-center" style="background-color: ${cfg.customBgColor}; border-color: ${cfg.customBorderColor}" />
                    </div>
                  </div>

                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label class="text-xs font-bold text-slate-300 block mb-1">Objetivo do Jogo</label>
                      <textarea id="new-game-objective" rows="2" placeholder="Objetivo..." class="w-full border rounded-xl p-2.5 text-xs text-white" style="background-color: ${cfg.customBgColor}; border-color: ${cfg.customBorderColor}"></textarea>
                    </div>
                    <div>
                      <label class="text-xs font-bold text-slate-300 block mb-1">Condição de Vitória</label>
                      <textarea id="new-game-victory" rows="2" placeholder="Como vence..." class="w-full border rounded-xl p-2.5 text-xs text-white" style="background-color: ${cfg.customBgColor}; border-color: ${cfg.customBorderColor}"></textarea>
                    </div>
                  </div>

                  <button type="submit" class="px-6 py-3 rounded-xl text-white font-bold text-xs shadow-lg" style="${accentStyle}">
                    Salvar e Adicionar à Estante
                  </button>
                </form>
              </div>
            </div>
          `}
        </main>

        <footer class="border-t py-4 text-center text-xs text-slate-500 mt-auto" style="border-color: ${cfg.customBorderColor}">
          ${cfg.footerText}
        </footer>
      `;

      root.innerHTML = html;
    }

    // INICIALIZAÇÃO AUTOMÁTICA AO CARREGAR
    window.addEventListener("DOMContentLoaded", () => {
      render();
    });
  </script>

</body>
</html>
